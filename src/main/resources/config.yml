# Panic config.
# Every number from the brief lands here as its build phase ships (see PLAN.md).
# Phase 1 (core loop) knobs below.

spawn-haven:
  # Size of the square safe region, in blocks (brief: ~24x24).
  size: 24
  # Flatten the haven at startup into a clean lit room: solid floor at one level, glowing border
  # ring on the edge, glowing center marker, ceiling cleared.
  build: true
  floor: SMOOTH_STONE
  border: GLOWSTONE
  # Ring of soft glow particles just above the border ring, so the safe room reads as warded
  # space from far away (needs build: true to anchor the ring to the floor level).
  aura: true
  # Peace ring radius around the haven center, in blocks. While a player is inside the ring, no
  # monsters spawn in it, monsters in it lose their target and catch fire, and alphas will not hunt
  # a player standing in it (no camping the gate).
  peace-radius: 32
  # Kit items given on first join (vanilla item strings), e.g. [IRON_SWORD, COBBLESTONE:16].
  kit:
    - IRON_SWORD
    - COBBLESTONE:16
    - BREAD:8
    - TORCH:8

day-night:
  # Ticks per phase. 6000 ticks = 5 min, 8400 = 7 min, 12000 = 10 min.
  # Day is the prep phase (gather, wall up, eat) — keep it long enough to actually build.
  day-length-ticks: 8400
  night-length-ticks: 12000

alpha:
  # Base mob type. Zombies first (brief).
  type: ZOMBIE
  health-multiplier: 5.0
  damage-multiplier: 2.0
  speed-multiplier: 0.5
  scale: 2.5
  # Custom long-range detection.
  detect-range: 100.0
  # Server-wide spawn cadence.
  spawn-interval-minutes: 10
  # Load-bearing performance cap (brief).
  max-concurrent: 4
  # Stuck handling: an alpha that has a target in range but barely moves is nudged, forced to
  # re-path after stuck-retarget-seconds, and despawned (replacing spawn cadence picks a new one)
  # after stuck-despawn-seconds.
  stuck-retarget-seconds: 10
  stuck-despawn-seconds: 30
  # When the alpha's last hunt target logs off, the alpha despawns after this many minutes.
  offline-despawn-minutes: 5
  # Glow effect makes alphas visible through walls. Turn off for pure-dark alphas.
  show-glow: true

horde:
  # Members per alpha.
  size: 8
  # Load-bearing performance cap: total live horde mobs, server wide.
  max-total: 40

highscore:
  # Percent of items and XP kept in the inventory on death (each item unit is a coin flip); the
  # rest drops at the grave as usual. 0 = full vanilla wipe. (Brief: 25%, written against stat
  # points — until RPG stats land this is the inventory/XP analog.)
  death-keeps-percent: 25

dread:
  # Proximity warning distances, blocks (brief: 80 / 40 / 15).
  far-range: 80
  mid-range: 40
  near-range: 15
  # Heartbeat (warden sound + darkness pulses) inside this range...
  heartbeat-range: 20
  # ...but total silence inside this one (brief: sudden silence before the ambush).
  silence-range: 8
  # Distant scream cadence, seconds (brief: every 20-40s).
  scream-min-seconds: 20
  scream-max-seconds: 40
  # Chance (0-100) a false-alarm roll fires a warning with no alpha behind it (brief: ~1 in 4).
  false-alarm-percent: 25
  false-alarm-min-seconds: 60
  false-alarm-max-seconds: 180

tunnel:
  # Blocked hunting zombies chew through the block ahead (brief: tunneling). Alphas do not dig.
  enabled: true
  # Horde dig speed, 1.0 = one material tier-second per second of being blocked (dirt ~1s, wood ~3s,
  # stone ~6s, metal ~15s at 1.0).
  horde-dig-speed: 1.0
  # Vanilla zombies dig too, at half the horde speed (brief). Clamped to (0, 1].
  vanilla-dig-speed: 0.5
  # Tunnels heal at dawn, but blocks broken in the final N seconds before dawn stay broken so
  # escapes are not walled off (brief).
  dawn-heal-grace-seconds: 30

mobs:
  # Base movement speed for creepers (vanilla creeper: 0.25, zombie: 0.23). Locked to the zombie
  # baseline so no mob reads as "fast"; set 0 to leave vanilla as-is.
  creeper-speed: 0.23
